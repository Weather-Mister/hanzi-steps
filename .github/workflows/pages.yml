name: Deploy Hanzi Steps to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate curriculum artifacts from canonical sources
        run: npm run course:generate
      - name: Run curriculum regression tests
        run: npm run test:curriculum
      - run: npm run build:pages
      - name: Check optional-unit responsive layout
        run: |
          npm install --prefix /tmp/hanzi-layout-tools --no-save --package-lock=false playwright@1.62.1
          node /tmp/hanzi-layout-tools/node_modules/playwright/cli.js install --with-deps chromium
          HANZI_PLAYWRIGHT=/tmp/hanzi-layout-tools/node_modules/playwright node --experimental-strip-types tests/browser/extras-layout.cjs
      - name: Upload optional-unit layout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-unit-layout
          path: test-results/extras
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
