name: Migrate Hanzi data to Cloudflare
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Controlled migration step
        required: true
        type: choice
        options: [prepare, import, activate, verify, enable-push]
permissions:
  contents: read
concurrency:
  group: hanzi-cloudflare-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/cloudflare-transfer.test.mjs
      - name: Execute verified migration step
        run: node --experimental-strip-types scripts/cloudflare-migrate-live.mjs "$MIGRATION_MODE"
        env:
          MIGRATION_MODE: ${{ inputs.mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
