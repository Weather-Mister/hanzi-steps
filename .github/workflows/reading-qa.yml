name: Reading browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'components/learning-app.tsx'
      - 'components/reading-checkpoint.tsx'
      - 'app/reading.css'
      - 'lib/reading-checkpoints.ts'
      - 'course/readings/**'
      - 'tests/browser/readings.cjs'
      - '.github/workflows/reading-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --experimental-strip-types tests/browser/readings.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-screenshots
          path: test-results/readings
