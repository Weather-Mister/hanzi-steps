name: Deploy Cloudflare production backend
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '!cloudflare/migration-transfer.sealed.json'
      - 'course/**'
      - 'lib/curriculum.ts'
      - 'scripts/cloudflare-migrate-live.mjs'
      - '.github/workflows/cloudflare-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hanzi-cloudflare-migration
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.HANZI_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run course:generate
      - run: npm run cloudflare:generate
      - run: npm run cloudflare:check
      - run: npm run cloudflare:test
      - name: Deploy verified backend and preserve notification activation
        run: node --experimental-strip-types scripts/cloudflare-migrate-live.mjs deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
